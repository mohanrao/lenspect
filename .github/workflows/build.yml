name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics opencv-python pyinstaller pillow numpy

      - name: Download YOLOv8 model
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"
          copy "%USERPROFILE%\AppData\Roaming\Ultralytics\yolov8n.pt" yolov8n.pt
        shell: cmd

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller lenspect.spec

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: LenspectAI-Windows
          path: dist/LenspectAI.exe
          retention-days: 30